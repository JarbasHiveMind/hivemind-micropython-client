name: Tests

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The device code targets MicroPython 1.20+; under CPython it must run
        # on the versions our reference stack supports.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "latest"

    - name: Install test dependencies
      # This is a MicroPython package (installed on-device via mip); it has no
      # CPython packaging. test-requirements.txt pulls the reference HiveMind
      # stack used to validate Protocol-V1 conformance, plus the CPython
      # accelerators the client uses when available.
      run: uv pip install --system -r test-requirements.txt

    - name: Run tests
      env:
        # Make the on-device `hivemind` package importable from the repo root.
        PYTHONPATH: ${{ github.workspace }}
      run: pytest test/ -v --tb=short

    - name: Coverage
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: pytest test/ --cov=hivemind --cov-report=term-missing

  micropython-syntax:
    # Sanity-check that the device modules at least parse and that no
    # CPython-only constructs sneak in beyond what MicroPython 1.20+ tolerates.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Compile device modules
      run: python -m py_compile hivemind/*.py examples/*.py
